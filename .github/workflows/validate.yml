name: Validate public PowerShell installer

on:
  push:
    branches: [main, feature/**, agent/**]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $bad = @()
          foreach ($file in Get-ChildItem -Recurse -File -Include *.ps1,*.psm1,*.psd1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $bad += "$($file.FullName): $($errors | ForEach-Object Message)" }
          }
          if ($bad.Count -gt 0) { throw ($bad -join "`n") }

      - name: Validate public files, profiles and referential integrity
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem -Recurse -File -Filter *.json) {
            [void](Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json)
          }

          $installer = Get-Content install-core.ps1 -Raw
          if ($installer -notmatch 'PowerShell Customization Public') {
            throw 'Collegamenti menu Start del repository pubblico non isolati.'
          }
          $template = Get-Content windows-terminal/managed-settings.json -Raw | ConvertFrom-Json
          $expected = @('Matrix Neon','Cyber Glass','Neon Dev','Stern HUD','Claude Code')
          if (@($template.profiles).Count -ne 5 -or @($template.schemes).Count -ne 5) { throw 'Attesi cinque profili e cinque schemi' }
          if (@($template.profiles | ForEach-Object guid | Select-Object -Unique).Count -ne 5) { throw 'GUID duplicati' }
          foreach ($terminalProfile in $template.profiles) {
            if ($terminalProfile.name -notin $expected) { throw "Profilo sconosciuto $($terminalProfile.name)" }
            if ($terminalProfile.commandline -notmatch 'pwsh\.exe -NoLogo') { throw "Il profilo $($terminalProfile.name) non usa PowerShell 7" }
            if ($terminalProfile.colorScheme -notin $template.schemes.name) { throw "Schema colore mancante $($terminalProfile.colorScheme)" }
            if ($terminalProfile.icon -match '^\{\{ASSET_ROOT\}\}\\(.+)$') {
              if (-not (Test-Path -LiteralPath (Join-Path 'assets' $Matches[1]) -PathType Leaf)) {
                throw "Icona mancante: $($terminalProfile.icon)"
              }
            }
          }
          foreach ($required in @('cybergpt/Select-ClaudeProject.ps1','cybergpt/themes/claude_code.omp.json',
                                   'commands/claude-code.ps1','launchers/src/Claude Code.c',
                                   'assets/icons/svi_gpt_original.ico')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Manca $required" }
          }
          $personalMarkers = @('notartel','Overdata','projects_ia','GITLAB_TOKEN','glpat-','sk-ant-')
          $sources = Get-ChildItem -Recurse -File -Include *.ps1,*.json,*.c,*.h |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($source in $sources) {
            $content = Get-Content -LiteralPath $source.FullName -Raw
            foreach ($marker in $personalMarkers) {
              if ($content.Contains($marker)) { throw "Possibile configurazione privata in $($source.FullName)" }
            }
          }

      - name: Test folder selector without interactive menu
        shell: pwsh
        run: |
          $previous = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'claude-selector'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
            $selected = & ./cybergpt/Select-ClaudeProject.ps1 -UseCurrentDirectory
            if ($selected -ne (Get-Location).Path) { throw "Directory selezionata errata: $selected" }
            $history = Join-Path $env:LOCALAPPDATA 'PowerShellCustomizationPublic/claude-project-history.json'
            if (-not (Test-Path -LiteralPath $history -PathType Leaf)) { throw 'Cronologia Claude non salvata.' }
            $entries = (Get-Content $history -Raw | ConvertFrom-Json).Paths
            if (@($entries).Count -ne 1) { throw 'Cronologia Claude inattesa.' }
            & ./cybergpt/Select-ClaudeProject.ps1 -UseCurrentDirectory | Out-Null
            $entries = (Get-Content $history -Raw | ConvertFrom-Json).Paths
            if (@($entries).Count -ne 1) { throw 'Cronologia duplicata.' }
          }
          finally { $env:LOCALAPPDATA = $previous }

      - name: Test installer conservativo con un profilo utente già esistente
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'public-install-test'
          $testProfile = Join-Path $base 'PowerShell/Microsoft.PowerShell_profile.ps1'
          $runtime = Join-Path $base 'runtime'
          $fragment = Join-Path $base 'fragments'
          $startMenu = Join-Path $base 'start'
          New-Item -ItemType Directory -Path (Split-Path -Parent $testProfile) -Force | Out-Null
          $encoding = [Text.UnicodeEncoding]::new($false,$true)
          $original = @'
          # FILE DEL COLLEGA - PRESERVARE
          function Test-ColleagueFunction { 'SAFE' }
          '@
          [IO.File]::WriteAllText($testProfile,$original,$encoding)

          $args = @{
            SkipDependencies = $true
            ProfilePathOverride = $testProfile
            RuntimeRootOverride = $runtime
            FragmentRootOverride = $fragment
            StartMenuRootOverride = $startMenu
          }
          & ./install.ps1 @args

          $result = [IO.File]::ReadAllText($testProfile,$encoding)
          if (-not $result.Contains($original.Trim())) { throw 'Contenuto del profilo perso.' }
          if ($result -notmatch '# >>> powershell-customization managed >>>') { throw 'Blocco managed mancante.' }
          $bytes = [IO.File]::ReadAllBytes($testProfile)
          if ($bytes[0] -ne 0xFF -or $bytes[1] -ne 0xFE) { throw 'BOM UTF-16 modificato.' }
          $fragmentFile = Join-Path $fragment 'powershell-customization-public.json'
          if (-not (Test-Path $fragmentFile)) { throw 'Fragment pubblico mancante.' }
          $json = Get-Content $fragmentFile -Raw | ConvertFrom-Json
          if (@($json.profiles).Count -ne 5) { throw 'Numero profili del fragment inatteso.' }
          foreach ($launcher in @('Matrix GPT','Cyber Glass','Neon Dev','Stern HUD','Claude Code')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime "launchers/$launcher.exe") -PathType Leaf)) {
              throw "Launcher mancante: $launcher"
            }
          }
          $digestBefore = (Get-FileHash $testProfile -Algorithm SHA256).Hash
          & ./install.ps1 @args
          $digestAfter = (Get-FileHash $testProfile -Algorithm SHA256).Hash
          if ($digestBefore -ne $digestAfter) { throw 'Seconda installazione non idempotente.' }
          if (-not (Test-Path (Join-Path $runtime 'PowerShellCustomizationPublic.psm1'))) { throw 'Modulo di reload mancante.' }
